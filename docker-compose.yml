services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - internal
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    networks:
      - internal
    entrypoint:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -Q "IF DB_ID(N'ExecutiveInsight') IS NULL CREATE DATABASE [ExecutiveInsight];"

  umbraco:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      sql-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Umbraco__CMS__WebRouting__UmbracoApplicationUrl: ${UMBRACO_APPLICATION_URL:-http://localhost:8080}
      OpenIddict__DisableTransportSecurityRequirement: ${OPENIDDICT_DISABLE_TRANSPORT_SECURITY_REQUIREMENT:-false}
      ConnectionStrings__umbracoDbDSN: Server=sqlserver,1433;Database=ExecutiveInsight;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=False;TrustServerCertificate=True
      ConnectionStrings__umbracoDbDSN_ProviderName: Microsoft.Data.SqlClient
      Umbraco__CMS__Unattended__InstallUnattended: "true"
      Umbraco__CMS__Unattended__UpgradeUnattended: "true"
      Umbraco__CMS__Unattended__UnattendedUserName: ${UMBRACO_ADMIN_NAME:?Set UMBRACO_ADMIN_NAME in .env}
      Umbraco__CMS__Unattended__UnattendedUserEmail: ${UMBRACO_ADMIN_EMAIL:?Set UMBRACO_ADMIN_EMAIL in .env}
      Umbraco__CMS__Unattended__UnattendedUserPassword: ${UMBRACO_ADMIN_PASSWORD:?Set UMBRACO_ADMIN_PASSWORD in .env}
      Umbraco__CMS__Unattended__UnattendedTelemetryLevel: Minimal
      BootstrapContent: ${BOOTSTRAP_CONTENT:-false}
      uSync__Settings__RootFolder: "uSync/v17/"
      uSync__Settings__ImportAtStartup: ${USYNC_IMPORT_AT_STARTUP:-None}
      uSync__Settings__ExportOnSave: "None"
      Turnstile__SiteKey: ${TURNSTILE_SITE_KEY:-}
      Turnstile__SecretKey: ${TURNSTILE_SECRET_KEY:-}
    volumes:
      - umbraco_media:/app/wwwroot/media
      - umbraco_data:/app/umbraco/Data
    networks:
      - internal
    mem_limit: 1200m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - umbraco
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - umbraco_caddy_data:/data
      - umbraco_caddy_config:/config
    networks:
      - internal
    mem_limit: 128m

networks:
  internal:

volumes:
  sqlserver_data:
  umbraco_media:
  umbraco_data:
  umbraco_caddy_data:
  umbraco_caddy_config:
